version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhooks
    ports:
      - "5432:5432"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  api:
    build: ./backend
    command: npm run start:api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/webhooks
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker-1:
    build: ./backend
    command: npm run start:worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/webhooks
      WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy

  worker-2:
    build: ./backend
    command: npm run start:worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/webhooks
      WORKER_ID: worker-2
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    depends_on:
      - api